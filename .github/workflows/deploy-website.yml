name: Deploy Website to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'filmfeed-website/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd filmfeed-website
          npm install

      - name: Build Next.js Site
        run: |
          cd filmfeed-website
          npm run build

      - name: Deploy to Vercel Non-Interactively
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          cd filmfeed-website
          npx vercel deploy --token "$VERCEL_TOKEN" --prod --yes
